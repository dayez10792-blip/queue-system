<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - จัดการคิวงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 p-4 md:p-8">

  <div class="max-w-4xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400"><i class="fa-solid fa-user-gear mr-2"></i>ระบบหลังบ้านจัดการคิว</h1>
        <p class="text-slate-400 text-sm">จัดการคิวงาน ติ๊กถูกรายการ และเพิ่มคิวใหม่</p>
      </div>
      <div class="flex gap-2">
        <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20 flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> เพิ่มคิวใหม่
        </button>
        <button onclick="loadAllQueues()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm transition">
          <i class="fa-solid fa-rotate mr-1"></i> รีเฟรช
        </button>
      </div>
    </div>

    <div id="queueContainer" class="space-y-4">
      <div class="text-center py-12 text-slate-500">กำลังโหลดรายการคิว...</div>
    </div>
  </div>

  <!-- Modal ป๊อบอัพสำหรับเพิ่มคิวใหม่ -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-lg shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
        <h3 class="text-lg font-bold text-indigo-400"><i class="fa-solid fa-user-plus mr-2"></i>สร้างคิวใหม่</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">เลขคิว (QueueNo)</label>
            <input type="number" id="newQueueNo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm" placeholder="เว้นว่างไว้เพื่อรันอัตโนมัติ">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Passcode (สุ่มให้อัตโนมัติ)</label>
            <div class="flex gap-1">
              <input type="text" id="newPasscode" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-mono">
              <button onclick="generatePasscode()" class="bg-slate-800 hover:bg-slate-700 px-3 rounded-xl text-xs"><i class="fa-solid fa-dice"></i></button>
            </div>
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">ชื่อลูกค้า</label>
          <input type="text" id="newCustName" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">ช่องทางติดต่อ</label>
            <input type="text" id="newContact" placeholder="เช่น FB: Mark" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">ID Game / Roblox</label>
            <input type="text" id="newGameID" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">รายการสั่งทำ (กดเพิ่มรายการได้)</label>
          <div id="newTasksContainer" class="space-y-2 mb-2"></div>
          <button onclick="addNewTaskInput()" class="w-full bg-slate-950 border border-dashed border-slate-700 hover:border-slate-500 text-slate-400 py-1.5 rounded-xl text-xs transition">
            + เพิ่มรายการสั่งทำ
          </button>
        </div>
      </div>

      <div class="flex gap-2 pt-5 border-t border-slate-800 mt-4">
        <button onclick="saveNewQueue()" id="btnSaveNew" class="flex-1 bg-indigo-600 hover:bg-indigo-500 font-medium py-2.5 rounded-xl text-sm transition">
          สร้างคิว
        </button>
        <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2.5 rounded-xl text-sm transition">ยกเลิก</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyQw5wXcf5XcMRs8JcgBNra5KdWT5j0JFxhxsTbUAifSpURG-ENsEJ1Wrc-1eH9lD7o/exec";

    async function loadAllQueues() {
      const container = document.getElementById('queueContainer');
      container.innerHTML = `<div class="text-center py-12 text-slate-500"><i class="fa-solid fa-circle-notch animate-spin mr-2"></i>กำลังดึงข้อมูลคิว...</div>`;

      try {
        const res = await fetch(API_URL);
        const queues = await res.json();
        container.innerHTML = '';

        if (!queues || queues.length === 0) {
          container.innerHTML = `<div class="text-center py-12 text-slate-500">ยังไม่มีข้อมูลคิวในระบบ</div>`;
          return;
        }

        queues.forEach((q) => {
          let tasks = [];
          if (q.TasksJson) {
            try { tasks = typeof q.TasksJson === 'string' ? JSON.parse(q.TasksJson) : q.TasksJson; } catch(e){}
          }

          const card = document.createElement('div');
          card.className = "bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg";

          card.innerHTML = `
            <div class="flex flex-col md:flex-row justify-between gap-4 border-b border-slate-800 pb-4 mb-4">
              <div>
                <span class="bg-indigo-500/10 text-indigo-400 font-bold px-3 py-1 rounded-full text-xs border border-indigo-500/20">
                  คิวที่ #${q.QueueNo}
                </span>
                <h3 class="text-lg font-bold mt-2">${q.CustomerName || '-'} <span class="text-xs font-normal text-slate-400">(Passcode: ${q.Passcode || '-'})</span></h3>
                <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-address-book mr-1"></i>ติดต่อ: ${q.Contact || '-'}</p>
                <p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-gamepad mr-1"></i>ID Game: ${q.GameID || '-'}</p>
              </div>

              <div class="space-y-2 text-right md:w-64">
                <div>
                  <label class="text-xs text-slate-500 block mb-1 text-left">สถานะการทำงาน</label>
                  <input type="text" id="status-${q.QueueNo}" value="${q.Status || 'กำลังทำงาน'}" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200">
                </div>
                <div>
                  <label class="text-xs text-slate-500 block mb-1 text-left">สถานะไอดี</label>
                  <select id="online-${q.QueueNo}" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200">
                    <option value="Online" ${String(q.OnlineStatus).toLowerCase() === 'online' ? 'selected' : ''}>Online</option>
                    <option value="Offline" ${String(q.OnlineStatus).toLowerCase() !== 'online' ? 'selected' : ''}>Offline</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="mb-4">
              <span class="text-xs text-slate-400 block mb-2">รายการสั่งทำ (ติ๊กเลือกเมื่อเสร็จสิ้น):</span>
              <div id="tasks-container-${q.QueueNo}" class="space-y-2">
                ${tasks.map((t, idx) => `
                  <label class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800 cursor-pointer">
                    <span class="text-sm text-slate-300">${t.name}</span>
                    <input type="checkbox" ${t.done ? 'checked' : ''} class="task-checkbox-${q.QueueNo} w-5 h-5 accent-indigo-500 rounded">
                  </label>
                `).join('')}
              </div>
            </div>

            <div class="flex gap-2">
              <button onclick="saveQueue(${q.QueueNo})" id="btn-save-${q.QueueNo}" 
                class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-xl text-sm transition">
                บันทึกการเปลี่ยนแปลง
              </button>
              <button onclick="deleteQueue(${q.QueueNo})" id="btn-delete-${q.QueueNo}" 
                class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/30 font-medium px-4 py-2 rounded-xl text-sm transition flex items-center gap-1.5">
                <i class="fa-solid fa-trash-can"></i> ลบคิว
              </button>
            </div>
          `;
          container.appendChild(card);
        });

      } catch(err) {
        container.innerHTML = `<div class="text-center py-12 text-rose-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
      }
    }

    async function saveQueue(queueNo) {
      const btn = document.getElementById(`btn-save-${queueNo}`);
      btn.innerText = "กำลังบันทึก...";
      btn.disabled = true;

      const newStatus = document.getElementById(`status-${queueNo}`).value;
      const newOnline = document.getElementById(`online-${queueNo}`).value;

      const checkboxes = document.querySelectorAll(`.task-checkbox-${queueNo}`);
      const taskContainer = document.getElementById(`tasks-container-${queueNo}`);
      const taskLabels = taskContainer.querySelectorAll('span.text-slate-300');

      let updatedTasks = [];
      checkboxes.forEach((cb, index) => {
        updatedTasks.push({ name: taskLabels[index].innerText, done: cb.checked });
      });

      const payload = { 
        action: "updateQueue",
        QueueNo: queueNo, 
        Status: newStatus, 
        OnlineStatus: newOnline, 
        TasksJson: JSON.stringify(updatedTasks) 
      };

      try {
        await fetch(API_URL, { 
          method: "POST", 
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload) 
        });
        alert(`อัปเดตข้อมูลคิวที่ #${queueNo} เรียบร้อยแล้ว!`);
      } catch (e) {
        alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล");
      }

      btn.innerText = "บันทึกการเปลี่ยนแปลง";
      btn.disabled = false;
    }

    // ฟังก์ชันสั่งลบคิว
    async function deleteQueue(queueNo) {
      if (!confirm(`คุณต้องการลบคิวที่ #${queueNo} ออกใช่หรือไม่? (ลบแล้วข้อมูลใน Google Sheet จะหายไปทันที)`)) {
        return;
      }

      const btn = document.getElementById(`btn-delete-${queueNo}`);
      btn.innerText = "กำลังลบ...";
      btn.disabled = true;

      const payload = {
        action: "deleteQueue",
        QueueNo: queueNo
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
        alert(`ลบคิวที่ #${queueNo} สำเร็จ!`);
        loadAllQueues(); // โหลดรายการคิวใหม่
      } catch (e) {
        alert("เกิดข้อผิดพลาดในการลบคิว");
        btn.innerText = "ลบคิว";
        btn.disabled = false;
      }
    }

    // Modal Control & Add New Queue
    function openModal() {
      document.getElementById('addModal').classList.remove('hidden');
      generatePasscode();
      document.getElementById('newTasksContainer').innerHTML = '';
      addNewTaskInput();
    }
    function closeModal() { document.getElementById('addModal').classList.add('hidden'); }
    function generatePasscode() {
      document.getElementById('newPasscode').value = Math.floor(10 + Math.random() * 90).toString();
    }
    function addNewTaskInput() {
      const div = document.createElement('div');
      div.className = "flex gap-2";
      div.innerHTML = `
        <input type="text" placeholder="ชื่อรายการ..." class="new-task-item w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-sm">
        <button onclick="this.parentElement.remove()" class="text-rose-500 px-2"><i class="fa-solid fa-trash"></i></button>
      `;
      document.getElementById('newTasksContainer').appendChild(div);
    }

    async function saveNewQueue() {
      const btn = document.getElementById('btnSaveNew');
      btn.innerText = "กำลังสร้าง...";
      btn.disabled = true;

      const queueNo = document.getElementById('newQueueNo').value;
      const passcode = document.getElementById('newPasscode').value;
      const custName = document.getElementById('newCustName').value;
      const contact = document.getElementById('newContact').value;
      const gameID = document.getElementById('newGameID').value;

      const taskInputs = document.querySelectorAll('.new-task-item');
      let tasks = [];
      taskInputs.forEach(input => {
        if(input.value.trim()) tasks.push({ name: input.value.trim(), done: false });
      });

      const payload = {
        action: "addQueue",
        QueueNo: queueNo,
        Passcode: passcode,
        CustomerName: custName,
        Contact: contact,
        GameID: gameID,
        Status: "กำลังทำงาน",
        OnlineStatus: "Offline",
        TasksJson: JSON.stringify(tasks)
      };

      try {
        await fetch(API_URL, { 
          method: "POST", 
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload) 
        });
        alert("เพิ่มคิวใหม่สำเร็จ!");
        closeModal();
        loadAllQueues();
      } catch(e) { alert("เกิดข้อผิดพลาดในการเพิ่มคิว"); }

      btn.innerText = "สร้างคิว";
      btn.disabled = false;
    }

    loadAllQueues();
  </script>
</body>
</html>
