<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบสถานะคิว</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
    <!-- Glow Effect Background -->
    <div class="absolute -top-10 -left-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl border border-indigo-500/20">
        <i class="fa-solid fa-list-check"></i>
      </div>
      <h1 class="text-xl font-bold text-white">ตรวจสอบสถานะคิวงาน</h1>
      <p class="text-slate-400 text-xs mt-1">กรอก Passcode เพื่อเช็คสถานะการดำเนินงาน</p>
    </div>

    <!-- ช่องค้นหาด้วย Passcode -->
    <div class="flex gap-2 mb-6">
      <input type="text" id="passcodeInput" placeholder="กรอก Passcode เช่น 11" 
        class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition text-center font-mono text-indigo-400 font-bold uppercase tracking-widest">
      <button onclick="searchQueue()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 rounded-2xl text-sm font-medium transition flex items-center justify-center">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <!-- ส่วนแสดงข้อมูลคิว -->
    <div id="resultContainer" class="hidden space-y-4">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4">
        
        <!-- หัวข้อคิว & สถานะ Online -->
        <div class="flex justify-between items-start mb-3 border-b border-slate-800 pb-3">
          <div>
            <span id="queueNoBadge" class="bg-indigo-500/10 text-indigo-400 text-xs font-bold px-2.5 py-1 rounded-full border border-indigo-500/20">
              คิวที่ #-
            </span>
            <h2 id="custNameText" class="text-base font-bold mt-2 text-white">-</h2>
            <p id="gameIdText" class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-gamepad mr-1"></i>ID Game: -</p>
          </div>
          <div id="onlineBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
            <span class="w-2 h-2 rounded-full bg-slate-500"></span>
            Offline
          </div>
        </div>

        <!-- สถานะการทำงาน -->
        <div class="mb-4">
          <span class="text-xs text-slate-500 block mb-1">สถานะปัจจุบัน:</span>
          <div id="statusBadge" class="inline-block bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 font-medium px-3 py-1 rounded-xl text-xs">
            กำลังดำเนินการ
          </div>
        </div>

        <!-- รายการงานที่ต้องทำ & Progress -->
        <div>
          <div class="flex justify-between text-xs text-slate-400 mb-1.5">
            <span>ความคืบหน้างาน</span>
            <span id="progressPercent">0%</span>
          </div>
          
          <!-- Progress Bar -->
          <div class="w-full bg-slate-900 rounded-full h-2 mb-3 overflow-hidden border border-slate-800">
            <div id="progressBar" class="bg-indigo-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>

          <div id="taskList" class="space-y-2">
            <!-- รายการงานย่อยจะแสดงตรงนี้ -->
          </div>
        </div>

      </div>
    </div>

    <!-- กล่องแจ้งเตือนกรณีไม่พบข้อมูล -->
    <div id="notFoundBox" class="hidden text-center py-8 text-slate-500 text-xs">
      <i class="fa-solid fa-circle-exclamation text-2xl mb-2 text-slate-600 block"></i>
      ไม่พบข้อมูลคิวสำหรับ Passcode นี้
    </div>

    <!-- โหลดดิ้ง -->
    <div id="loadingBox" class="hidden text-center py-8 text-slate-500 text-xs">
      <i class="fa-solid fa-circle-notch animate-spin text-xl text-indigo-500 mb-2 block"></i>
      กำลังค้นหาข้อมูล...
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyQw5wXcf5XcMRs8JcgBNra5KdWT5j0JFxhxsTbUAifSpURG-ENsEJ1Wrc-1eH9lD7o/exec";

    // อ่านค่าตัวแปร ?code= จาก URL (ถ้าน้องส่งลิงก์ให้ลูกค้าดูตรงๆ)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (code) {
        document.getElementById('passcodeInput').value = code;
        searchQueue();
      }
    });

    async function searchQueue() {
      const passcode = document.getElementById('passcodeInput').value.trim();
      if (!passcode) return;

      const resultContainer = document.getElementById('resultContainer');
      const notFoundBox = document.getElementById('notFoundBox');
      const loadingBox = document.getElementById('loadingBox');

      resultContainer.classList.add('hidden');
      notFoundBox.classList.add('hidden');
      loadingBox.classList.remove('hidden');

      try {
        const res = await fetch(API_URL);
        const queues = await res.json();
        loadingBox.classList.add('hidden');

        // ค้นหาคิวที่มี Passcode ตรงกัน (เปรียบเทียบแบบไม่สนอักษรตัวเล็ก-ใหญ่)
        const matched = queues.find(q => String(q.Passcode).trim().toLowerCase() === passcode.toLowerCase());

        if (matched) {
          document.getElementById('queueNoBadge').innerText = `คิวที่ #${matched.QueueNo}`;
          document.getElementById('custNameText').innerText = matched.CustomerName || 'ลูกค้า';
          document.getElementById('gameIdText').innerHTML = `<i class="fa-solid fa-gamepad mr-1"></i>ID Game: ${matched.GameID || '-'}`;
          document.getElementById('statusBadge').innerText = matched.Status || 'กำลังทำงาน';

          // จัดการแสดงผลสถานะไอดี Online/Offline
          const isOnline = String(matched.OnlineStatus).toLowerCase() === 'online';
          const onlineBadge = document.getElementById('onlineBadge');
          if (isOnline) {
            onlineBadge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
            onlineBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online`;
          } else {
            onlineBadge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700";
            onlineBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-500"></span> Offline`;
          }

          // แปลงรายการงานย่อย (TasksJson)
          let tasks = [];
          if (matched.TasksJson) {
            try { tasks = typeof matched.TasksJson === 'string' ? JSON.parse(matched.TasksJson) : matched.TasksJson; } catch(e){}
          }

          const taskList = document.getElementById('taskList');
          taskList.innerHTML = '';
          let doneCount = 0;

          if (tasks.length > 0) {
            tasks.forEach(t => {
              if (t.done) doneCount++;
              const item = document.createElement('div');
              item.className = `flex items-center justify-between p-2.5 rounded-xl border text-xs ${
                t.done 
                  ? 'bg-slate-900/50 border-slate-800/80 text-slate-500 line-through' 
                  : 'bg-slate-900 border-slate-800 text-slate-200'
              }`;
              item.innerHTML = `
                <span>${t.name}</span>
                <i class="${t.done ? 'fa-solid fa-circle-check text-emerald-500' : 'fa-regular fa-circle text-slate-600'} text-sm"></i>
              `;
              taskList.appendChild(item);
            });

            // คำนวณ % ความคืบหน้า
            const percent = Math.round((doneCount / tasks.length) * 100);
            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;
          } else {
            taskList.innerHTML = `<div class="text-xs text-slate-500 text-center py-2">ไม่มีรายการสั่งทำย่อย</div>`;
            document.getElementById('progressPercent').innerText = `0%`;
            document.getElementById('progressBar').style.width = `0%`;
          }

          resultContainer.classList.remove('hidden');
        } else {
          notFoundBox.classList.remove('hidden');
        }

      } catch (err) {
        loadingBox.classList.add('hidden');
        notFoundBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
